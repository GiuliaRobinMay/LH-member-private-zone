<script>
/* ==================================================================
   store.js — all state for My Lesko Zone.

   This is a MOCK-UP. There is no server and no database. Everything
   the member does is kept in this browser's localStorage so the demo
   survives a refresh, and "Start the demo over" reseeds it.
   ================================================================== */

(function (global) {
  "use strict";

  var KEY = "lesko-zone.v2";

  /* ---------------------------------------------------------- helpers */

  function clone(v) {
    return JSON.parse(JSON.stringify(v));
  }

  function uid(prefix) {
    return (
      prefix + "-" + Date.now().toString(36) + "-" +
      Math.random().toString(36).slice(2, 7)
    );
  }

  /** Human "3 days ago" from an ISO date. */
  function ago(iso) {
    if (!iso) return "";
    var then = new Date(iso).getTime();
    if (isNaN(then)) return "";
    var mins = Math.round((Date.now() - then) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + (mins === 1 ? " minute ago" : " minutes ago");
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
    var days = Math.round(hrs / 24);
    if (days < 31) return days + (days === 1 ? " day ago" : " days ago");
    var months = Math.round(days / 30);
    if (months < 12) return months + (months === 1 ? " month ago" : " months ago");
    return Math.round(months / 12) + " year ago";
  }

  function shorten(text, n) {
    var s = String(text || "").replace(/\s+/g, " ").trim();
    if (s.length <= n) return s;
    return s.slice(0, n - 1).replace(/[\s,.;:]+$/, "") + "…";
  }

  /* ------------------------------------------------------------ state */

  var state = null;

  function fresh() {
    var seed = clone(global.LZ_SEED);
    return {
      version: 2,
      member: seed.member,
      questions: seed.threads,
      sheets: seed.callSheets,
      copy: seed.microcopy,
    };
  }

  function load() {
    var raw = null;
    try {
      raw = global.localStorage.getItem(KEY);
    } catch (e) {
      /* private mode / storage blocked — fall through to seed */
    }
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.version === 2 && parsed.sheets) {
          // Copy always comes from the seed, so editing seed.js shows up
          // without clearing storage.
          parsed.copy = clone(global.LZ_SEED).microcopy;
          return parsed;
        }
      } catch (e) {
        /* corrupt — fall through to seed */
      }
    }
    return fresh();
  }

  function save() {
    try {
      global.localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      /* storage full or blocked — the demo still works this session */
    }
  }

  /* -------------------------------------------------------- questions */

  function addQuestion(fields) {
    var nowISO = new Date().toISOString();
    var thread = {
      id: uid("q"),
      subject: shorten(fields.body, 68),
      topic: fields.topic || "",
      status: "waiting",
      location: fields.location || "",
      createdAt: nowISO,
      ago: "just now",
      isNew: true,
      messages: [
        {
          role: "member",
          name: state.member.name,
          roleLabel: "",
          body: fields.body,
          createdAt: nowISO,
          ago: "just now",
        },
      ],
    };
    state.questions.unshift(thread);
    save();
    return thread;
  }

  function addReply(threadId, body) {
    var t = getQuestion(threadId);
    if (!t) return null;
    var nowISO = new Date().toISOString();
    t.messages.push({
      role: "member",
      name: state.member.name,
      roleLabel: "",
      body: body,
      createdAt: nowISO,
      ago: "just now",
    });
    t.status = "waiting";
    save();
    return t;
  }

  /** Simulated team answer — in the real product this arrives from the
      team's question-answering dashboard. */
  function simulateAnswer(threadId) {
    var t = getQuestion(threadId);
    if (!t) return null;
    var responder = global.LZ_SEED.autoReply;
    t.messages.push({
      role: "team",
      name: responder.name,
      roleLabel: responder.roleLabel,
      body: responder.body.replace(/\{name\}/g, state.member.name.split(" ")[0]),
      attachments: responder.attachments ? clone(responder.attachments) : [],
      createdAt: new Date().toISOString(),
      ago: "just now",
    });
    t.status = "answered";
    save();
    return t;
  }

  function getQuestion(id) {
    for (var i = 0; i < state.questions.length; i++) {
      if (state.questions[i].id === id) return state.questions[i];
    }
    return null;
  }

  function markRead(threadId) {
    var t = getQuestion(threadId);
    if (t && t.unread) {
      t.unread = false;
      save();
    }
  }

  /** The "we have your question" note is shown once, then retired. */
  function clearNew(threadId) {
    var t = getQuestion(threadId);
    if (t && t.isNew) {
      t.isNew = false;
      save();
    }
  }

  /* ------------------------------------------------------ call sheets */

  function getSheet(id) {
    for (var i = 0; i < state.sheets.length; i++) {
      if (state.sheets[i].id === id) return state.sheets[i];
    }
    return null;
  }

  /**
   * Build a new call sheet from the member's inputs.
   *
   * MOCK-UP: the research is simulated. We take the prepared sheet that
   * best matches the chosen topic and re-address it with the member's own
   * words and place. In the real product this is where the AI research
   * call goes.
   */
  function buildSheet(input) {
    var library = global.LZ_SEED.callSheets;
    var map = global.LZ_SEED.topicMap || {};
    var base = null;
    var i;

    var wanted = input.topicKey;
    if (map[wanted]) {
      for (i = 0; i < library.length; i++) {
        if (library[i].id === map[wanted]) base = library[i];
      }
    }
    if (!base) {
      for (i = 0; i < library.length; i++) {
        if (library[i].topicKey === wanted) base = library[i];
      }
    }
    if (!base) base = library[0];

    var sheet = clone(base);
    var first = state.member.name.split(" ")[0];

    /* Label the sheet with the topic the member actually chose. */
    var topics = (state.copy && state.copy.topics) || [];
    for (i = 0; i < topics.length; i++) {
      if (topics[i].key === wanted) {
        sheet.topic = topics[i].label;
        sheet.topicKey = topics[i].key;
      }
    }

    sheet.id = uid("cs");
    sheet.createdAt = new Date().toISOString();
    sheet.ago = "just now";
    sheet.memberName = first;
    sheet.city = input.city || sheet.city;
    sheet.state = input.state || sheet.state;
    sheet.zip = input.zip || sheet.zip;
    sheet.problem = input.problem || sheet.problem;
    sheet.called = [];

    var place = [sheet.city, sheet.state].filter(Boolean).join(", ") || sheet.zip;

    sheet.opening = openingFor(first, place, sheet, input);
    sheet.firstCall.why = personalise(sheet.firstCall.why, first, place, base);
    sheet.firstCall.whatToSay = personalise(sheet.firstCall.whatToSay, first, place, base);
    for (i = 0; i < sheet.orgs.length; i++) {
      sheet.orgs[i].script = personalise(sheet.orgs[i].script, first, place, base);
    }

    state.sheets.unshift(sheet);
    save();
    return sheet;
  }

  /** Open with the member's actual words, so the sheet is visibly theirs. */
  function openingFor(first, place, sheet, input) {
    var said = String(input.problem || "").replace(/\s+/g, " ").trim();
    if (said.length > 190) {
      said = said.slice(0, 189).replace(/[\s,.;:]+$/, "") + "…";
    }
    return (
      "Here is what I found for you, " + first + ". You told me: “" + said +
      "” So I went looking for help with " + (sheet.topic || "").toLowerCase() +
      " near " + place + ". Below are " + sheet.orgs.length +
      " places that can help, with the phone numbers and the words to say when " +
      "they pick up. Start with the first one — that is the call that matters most."
    );
  }

  /** Swap the prepared sheet's member name and place for this member's. */
  function personalise(text, first, place, base) {
    var out = String(text || "");
    if (base.memberName) out = out.split(base.memberName).join(first);

    var basePlace = [base.city, base.state].filter(Boolean).join(", ");
    var city = place.split(",")[0].trim();

    if (basePlace && place && basePlace !== place) out = out.split(basePlace).join(place);
    if (base.city && city && base.city !== city) out = out.split(base.city).join(city);

    return out.replace(/\s{2,}/g, " ").trim();
  }

  /** Tick / untick "called" on a call sheet row, remembering the day. */
  function toggleCalled(sheetId, orgId) {
    var s = getSheet(sheetId);
    if (!s) return false;
    if (!s.called) s.called = [];
    if (!s.calledAt) s.calledAt = {};
    var at = s.called.indexOf(orgId);
    if (at === -1) {
      s.called.push(orgId);
      s.calledAt[orgId] = new Date().toISOString();
    } else {
      s.called.splice(at, 1);
      delete s.calledAt[orgId];
    }
    save();
    return s.called.indexOf(orgId) !== -1;
  }

  function calledOn(sheetId, orgId) {
    var s = getSheet(sheetId);
    return (s && s.calledAt && s.calledAt[orgId]) || "";
  }

  /** A private note on one row of a call sheet. */
  function setOrgNote(sheetId, orgId, text) {
    var s = getSheet(sheetId);
    if (!s) return;
    if (!s.notes) s.notes = {};
    if (text) s.notes[orgId] = text;
    else delete s.notes[orgId];
    save();
  }

  function orgNote(sheetId, orgId) {
    var s = getSheet(sheetId);
    return (s && s.notes && s.notes[orgId]) || "";
  }

  /** "Was this helpful?" on an answer. */
  function setFeedback(threadId, val, note) {
    var t = getQuestion(threadId);
    if (!t) return;
    t.feedback = { val: val, note: note || "" };
    save();
  }

  function isCalled(sheetId, orgId) {
    var s = getSheet(sheetId);
    return !!(s && s.called && s.called.indexOf(orgId) !== -1);
  }

  /* ---------------------------------------------------- badge counts */

  function counts() {
    var unread = 0;
    for (var i = 0; i < state.questions.length; i++) {
      if (state.questions[i].unread) unread++;
    }
    return {
      questions: state.questions.length,
      unread: unread,
      sheets: state.sheets.length,
    };
  }

  /* -------------------------------------------------------- lifecycle */

  function reset() {
    try {
      global.localStorage.removeItem(KEY);
    } catch (e) {
      /* nothing to clear */
    }
    state = fresh();
    save();
  }

  function init() {
    state = load();
    return state;
  }

  /* ----------------------------------------------------------- export */

  global.LZ = global.LZ || {};
  global.LZ.store = {
    init: init,
    save: save,
    reset: reset,
    get state() {
      return state;
    },
    get copy() {
      return state.copy;
    },
    get member() {
      return state.member;
    },
    ago: ago,
    uid: uid,
    shorten: shorten,

    addQuestion: addQuestion,
    addReply: addReply,
    simulateAnswer: simulateAnswer,
    getQuestion: getQuestion,
    markRead: markRead,
    clearNew: clearNew,

    getSheet: getSheet,
    buildSheet: buildSheet,
    toggleCalled: toggleCalled,
    isCalled: isCalled,
    calledOn: calledOn,
    setOrgNote: setOrgNote,
    orgNote: orgNote,
    setFeedback: setFeedback,

    counts: counts,
  };
})(window);

</script>
<script>
/* ==================================================================
   views.js — the screens of My Lesko Zone.

   Two split tabs — Ask a question · Create my call sheet — each with
   a small ☰ that opens its list. Forms submit with a red button on
   the right. A call sheet opens straight into the working list:
   called-tick, phone, email, website, a note, and the date.
   Views are pure: state in, markup out. app.js wires interaction
   through data-act attributes.
   ================================================================== */

(function (global) {
  "use strict";

  var store = global.LZ.store;

  /* ---------------------------------------------------------- helpers */

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  /** Escape, then make bare URLs and phone numbers tappable. */
  function rich(s) {
    var out = esc(s);
    out = out.replace(/(https?:\/\/[^\s<)"']+)/g, function (m) {
      var href = m.replace(/[.,;:)]+$/, "");
      var tail = m.slice(href.length);
      return (
        '<a href="' + href + '" target="_blank" rel="noopener">' +
        href.replace(/^https?:\/\//, "") +
        "</a>" + tail
      );
    });
    out = out.replace(
      /\b(1[-.\s]?)?(\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4})\b/g,
      function (m) {
        return '<a href="tel:' + m.replace(/[^\d+]/g, "") + '">' + m + "</a>";
      }
    );
    return out;
  }

  function tel(phone) {
    return String(phone || "").replace(/[^\d+]/g, "");
  }

  /** Pull the dialable number out of a phone field that may be prose. */
  function phoneNumber(raw) {
    var s = String(raw || "").trim();
    if (!s) return "";
    var shortCode = s.match(/^(2-?1-?1|9-?8-?8)\b/);
    if (shortCode) return shortCode[0];
    var m = s.match(/(\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/);
    return m ? m[0].trim() : "";
  }

  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return esc(iso);
    return d.toLocaleDateString(undefined, {
      day: "numeric",
      month: "short",
      year: "numeric",
    });
  }

  /** The date a thing happened, the way a person says it. */
  function niceDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var now = new Date();
    var oneDay = 86400000;
    var startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    if (d.getTime() >= startToday) return "Today";
    if (d.getTime() >= startToday - oneDay) return "Yesterday";
    return fmtDate(iso);
  }

  /** Attachment chips on a team answer — files the team sent along. */
  function fileChips(list) {
    if (!list || !list.length) return "";
    return (
      '<span class="file-chips">' +
      list
        .map(function (f) {
          var isXls = /excel|xls|sheet/i.test(f.kind || "");
          return (
            '<button type="button" class="file-chip" data-act="demo-file" data-name="' +
            esc(f.name) + '">' +
            '<span class="f-ico' + (isXls ? " xls" : "") + '" aria-hidden="true">' +
            esc(isXls ? "XLS" : "PDF") + "</span>" +
            '<span class="f-name">' + esc(f.name) +
            '<span class="f-size">' + esc((f.kind || "") + (f.size ? " · " + f.size : "")) +
            "</span></span></button>"
          );
        })
        .join("") +
      "</span>"
    );
  }

  function privateLine() {
    return (
      '<p class="private-line"><span aria-hidden="true">&#128274;</span>' +
      "<span>Private — only you and the Lesko Help team can see this.</span></p>"
    );
  }

  /* ============================================== ASK A QUESTION (form) */

  function ask() {
    return (
      '<section class="panel">' +
      '<form class="form-card" id="ask-form" novalidate>' +
      '<div class="field">' +
      '<label for="ask-body">What do you need help with?</label>' +
      '<textarea id="ask-body" rows="5" placeholder="Tell us in your own words. For example: I’m behind on my electric bill and I don’t know who to call. Spelling doesn’t matter."></textarea>' +
      "</div>" +
      '<div class="field-row">' +
      '<div class="field"><label for="ask-zip">Your ZIP code</label>' +
      '<input id="ask-zip" inputmode="numeric" autocomplete="postal-code" placeholder="Example: 14604"></div>' +
      '<div class="field"><label for="ask-state">Your state</label>' +
      '<input id="ask-state" autocomplete="address-level1" placeholder="Example: New York"></div>' +
      "</div>" +
      '<p class="form-error" id="ask-error">Please type your question first — even a few words is enough.</p>' +
      '<div class="form-actions">' +
      '<button class="btn red big" type="submit">Send my question</button>' +
      "</div></form>" +
      privateLine() +
      "</section>"
    );
  }

  /* ============================================== MY QUESTIONS (list) */

  function questions() {
    var qs = store.state.questions;
    if (!qs.length) {
      return (
        '<section class="panel"><div class="card empty-note">' +
        '<div class="q" aria-hidden="true">?</div>' +
        "<h3>No questions yet</h3>" +
        '<button class="btn red" data-act="go" data-to="ask">Ask your first question</button>' +
        "</div></section>"
      );
    }

    var rows = qs
      .map(function (q) {
        var dot = q.unread ? "new" : q.status === "answered" ? "" : "waiting";
        var st = q.unread
          ? '<span class="st-new">New answer</span>'
          : q.status === "answered"
          ? '<span class="st-ok">Answered &#10003;</span>'
          : '<span class="st-wait">No answer yet</span>';
        return (
          '<button class="convo' + (q.unread ? " unread" : "") +
          '" data-act="thread" data-id="' + esc(q.id) + '">' +
          '<span class="c-dot ' + dot + '" aria-hidden="true"></span>' +
          "<span>" +
          '<span class="c-subj">' + esc(q.subject) + "</span>" +
          '<span class="c-meta">' + st + "</span>" +
          "</span>" +
          '<span class="c-when">' + esc(niceDate(q.createdAt)) + "</span></button>"
        );
      })
      .join("");

    return (
      '<section class="panel">' +
      '<div class="convos">' + rows + "</div>" +
      privateLine() +
      "</section>"
    );
  }

  /* ---------------------------------------------------- one thread */

  function thread(id) {
    var q = store.getQuestion(id);
    if (!q) return notFound("conversation", "questions");

    var msgs = q.messages
      .map(function (m) {
        var isTeam = m.role === "team";
        return (
          '<div class="brow ' + (isTeam ? "team" : "me") + '">' +
          '<div class="bubble">' +
          (isTeam ? '<span class="b-who">' + esc(m.name) + " &middot; Lesko Help</span>" : "") +
          rich(m.body) +
          (isTeam ? fileChips(m.attachments) : "") +
          "</div></div>" +
          '<div class="bmeta">' + esc(store.ago(m.createdAt) || m.ago) + "</div>"
        );
      })
      .join("");

    var waitingNote =
      q.status === "waiting"
        ? '<p class="private-line"><span aria-hidden="true">&#8987;</span>' +
          "<span>Your question is with the team — answers usually come back within a day or two.</span></p>"
        : "";

    return (
      '<section class="panel">' +
      '<div class="thread-head">' +
      '<button class="backlink" data-act="go" data-to="questions" style="margin:0">&larr; My questions</button>' +
      '<span class="c-when">' + esc(niceDate(q.createdAt)) + "</span>" +
      "</div>" +
      msgs +
      feedbackBlock(q) +
      '<div id="typing-slot"></div>' +
      waitingNote +
      '<form class="compose" id="reply-form" style="margin-top:10px">' +
      '<label class="sr-only" for="reply-input">Write back</label>' +
      '<textarea id="reply-input" rows="1" placeholder="Write back&hellip;"></textarea>' +
      '<button class="send" type="submit" data-id="' + esc(q.id) +
      '" aria-label="Send my reply">&#8593;</button>' +
      "</form>" +
      "</section>"
    );
  }

  /** "Was this helpful?" under the team's answer. */
  function feedbackBlock(q) {
    if (q.status !== "answered") return "";

    if (q.feedback && q.feedback.val) {
      return (
        '<div class="feedback done"><span aria-hidden="true">&#10003;</span> ' +
        "Thank you for your feedback — the team reads every one.</div>"
      );
    }

    var explaining = global.LZ.ui && global.LZ.ui.explain === q.id;
    if (explaining) {
      return (
        '<div class="feedback">' +
        '<span class="fb-q">What was missing? Tell us and the team will try again.</span>' +
        '<form class="compose" id="fb-form" style="margin:8px 0 0">' +
        '<label class="sr-only" for="fb-note">What was missing?</label>' +
        '<textarea id="fb-note" rows="1" placeholder="Tell us in your own words&hellip;"></textarea>' +
        '<button class="send" type="submit" data-act="fb-send" data-id="' + esc(q.id) +
        '" aria-label="Send feedback">&#8593;</button>' +
        "</form></div>"
      );
    }

    return (
      '<div class="feedback">' +
      '<span class="fb-q">Was this answer helpful?</span>' +
      '<button class="btn ghost" data-act="fb-yes" data-id="' + esc(q.id) +
      '">&#128077; Yes</button>' +
      '<button class="btn ghost" data-act="fb-no" data-id="' + esc(q.id) +
      '">&#128078; Not yet</button>' +
      "</div>"
    );
  }

  /** The animated "the team is typing" bubble, injected by app.js. */
  function typingBubble() {
    return (
      '<div class="brow team typing"><div class="bubble" aria-label="The team is typing">' +
      '<span class="d"></span><span class="d"></span><span class="d"></span>' +
      "</div></div>"
    );
  }

  /* ========================================= CREATE MY CALL SHEET (form) */

  function build() {
    var topics = store.copy.topics || [];
    var opts = '<option value="">Choose one&hellip;</option>';
    topics.forEach(function (t) {
      opts += '<option value="' + esc(t.key) + '">' + esc(t.label) + "</option>";
    });

    return (
      '<section class="panel">' +
      '<form class="form-card" id="build-form" novalidate>' +
      '<div class="field">' +
      '<label for="b-topic">What do you need help with?</label>' +
      '<select id="b-topic">' + opts + "</select></div>" +
      '<div class="field-row three">' +
      '<div class="field"><label for="b-zip">ZIP code</label>' +
      '<input id="b-zip" inputmode="numeric" autocomplete="postal-code" placeholder="14604"></div>' +
      '<div class="field"><label for="b-city">City</label>' +
      '<input id="b-city" autocomplete="address-level2" placeholder="Rochester"></div>' +
      '<div class="field"><label for="b-state">State</label>' +
      '<input id="b-state" autocomplete="address-level1" placeholder="New York"></div>' +
      "</div>" +
      '<div class="field">' +
      '<label for="b-problem">Tell us what&rsquo;s going on</label>' +
      '<textarea id="b-problem" rows="4" placeholder="Your own words are perfect — spelling doesn&rsquo;t matter."></textarea>' +
      "</div>" +
      '<p class="form-error" id="build-error"></p>' +
      '<div class="form-actions">' +
      '<button class="btn red big" type="submit">Create my call sheet</button>' +
      "</div></form>" +
      privateLine() +
      "</section>"
    );
  }

  function generating() {
    return (
      '<section class="panel"><div class="card generating">' +
      '<div class="suits" aria-hidden="true"><span>&spades;</span><span>&hearts;</span><span>&diams;</span><span>&clubs;</span></div>' +
      '<p class="progress-msg" id="progress-msg" role="status" aria-live="polite"></p>' +
      '<div class="bar"><i id="progress-bar"></i></div>' +
      "</div></section>"
    );
  }

  /* ============================================= MY CALL SHEETS (list) */

  function sheets() {
    var list = store.state.sheets;
    if (!list.length) {
      return (
        '<section class="panel"><div class="card empty-note">' +
        '<div class="q" aria-hidden="true">?</div>' +
        "<h3>No call sheets yet</h3>" +
        '<button class="btn red" data-act="go" data-to="build">Create your first call sheet</button>' +
        "</div></section>"
      );
    }

    var rows = list
      .map(function (sh) {
        var called = (sh.called || []).length;
        var place = [sh.city, sh.state].filter(Boolean).join(", ") || sh.zip;
        return (
          '<button class="convo" data-act="sheet" data-id="' + esc(sh.id) + '">' +
          '<span class="c-dot' + (called ? "" : " waiting") + '" aria-hidden="true"></span>' +
          "<span>" +
          '<span class="c-subj">' + esc(sh.title) + "</span>" +
          '<span class="c-meta">' + esc(place) + " &nbsp;&middot;&nbsp; " +
          sh.orgs.length + " places" +
          (called
            ? ' &nbsp;&middot;&nbsp; <span class="st-ok">' + called + " called &#10003;</span>"
            : "") +
          "</span></span>" +
          '<span class="c-when">' + esc(niceDate(sh.createdAt)) + "</span></button>"
        );
      })
      .join("");

    return (
      '<section class="panel">' +
      '<div class="convos">' + rows + "</div>" +
      privateLine() +
      "</section>"
    );
  }

  /* ------------------------------------- one call sheet: the work list */

  function sheet(id) {
    var sh = store.getSheet(id);
    if (!sh) return notFound("call sheet", "sheets");

    var rows = sh.orgs.map(function (o) {
      return workRow(sh, o);
    }).join("");

    return (
      '<section class="panel">' +
      '<div class="thread-head">' +
      '<button class="backlink" data-act="go" data-to="sheets" style="margin:0">&larr; My call sheets</button>' +
      '<span class="c-when">' + esc(niceDate(sh.createdAt)) + "</span>" +
      "</div>" +
      '<div class="w-titlebar">' +
      '<h2 class="sheet-title" style="margin:0">' + esc(sh.title) + "</h2>" +
      '<button class="btn ghost" data-act="export-csv" data-sheet="' + esc(sh.id) +
      '">&#11015; Download</button>' +
      "</div>" +
      '<div class="work">' + rows + "</div>" +
      "</section>"
    );
  }

  function workRow(sh, org) {
    var done = store.isCalled(sh.id, org.id);
    var when = store.calledOn(sh.id, org.id);
    var note = store.orgNote(sh.id, org.id);
    var num = phoneNumber(org.phone);
    var rid = "wrow-" + sh.id + "-" + org.id;

    var contacts = [];
    if (num) {
      contacts.push(
        '<a class="w-tel" href="tel:' + esc(tel(num)) + '">&#9742; ' + esc(num) + "</a>"
      );
    }
    if (org.email) {
      contacts.push('<a href="mailto:' + esc(org.email) + '">&#9993; Email</a>');
    }
    if (org.url) {
      contacts.push(
        '<a href="' + esc(org.url) + '" target="_blank" rel="noopener">&#127760; Website</a>'
      );
    }

    return (
      '<div class="wrow' + (done ? " done" : "") + '" id="' + esc(rid) + '">' +
      '<label class="called-box">' +
      '<input type="checkbox" data-act="called" data-sheet="' + esc(sh.id) +
      '" data-org="' + esc(org.id) + '"' + (done ? " checked" : "") +
      ' aria-label="Called: ' + esc(org.name) + '">' +
      '<span class="cl" aria-hidden="true">Called</span></label>' +
      "<div>" +
      '<p class="org-name">' + esc(org.name) + "</p>" +
      '<p class="w-contacts">' + contacts.join('<span class="w-sep">&middot;</span>') + "</p>" +
      '<span class="w-called" data-slot="called">' +
      (when ? "&#10003; Called " + esc(niceDate(when)) : "") +
      "</span>" +
      '<div class="w-note" data-slot="note">' +
      (note ? '<p class="w-note-text">&#128221; ' + esc(note) + "</p>" : "") +
      "</div>" +
      "</div>" +
      '<button class="linklike w-note-btn" data-act="org-note" data-sheet="' + esc(sh.id) +
      '" data-org="' + esc(org.id) + '">' +
      (note ? "Edit note" : "+ Note") +
      "</button>" +
      "</div>"
    );
  }

  /* --------------------------------------------------------- fallback */

  function notFound(what, backTo) {
    return (
      '<section class="panel"><div class="card empty-note">' +
      '<div class="q" aria-hidden="true">?</div>' +
      "<h3>We could not find that " + esc(what) + "</h3>" +
      '<button class="btn red" data-act="go" data-to="' + esc(backTo) + '">Go back</button>' +
      "</div></section>"
    );
  }

  /* ----------------------------------------------------------- export */

  global.LZ = global.LZ || {};
  global.LZ.views = {
    ask: ask,
    questions: questions,
    thread: thread,
    typingBubble: typingBubble,
    build: build,
    sheets: sheets,
    generating: generating,
    sheet: sheet,
    workRow: workRow,
    niceDate: niceDate,
    esc: esc,
  };
})(window);

</script>
<script>
/* ==================================================================
   app.js — two tabs, a chat, a call sheet builder.

   Hash routing on purpose: the widget works opened straight from
   disk and inside a Mighty Networks iframe, and a member can be
   deep-linked back to one conversation or one call sheet.
   ================================================================== */

(function (global) {
  "use strict";

  var store = global.LZ.store;
  var views = global.LZ.views;

  var face = document.getElementById("face");
  var toastEl = document.getElementById("toast");

  var toastTimer = null;
  global.LZ.ui = { explain: null };
  var pendingAnswer = null;
  var typingTimer = null;
  var resetTimer = null;

  /* ------------------------------------------------------------- tabs */

  /* Two split tabs. The main part opens the form; the small ☰ opens
     that side's list, so the archive is always one tap away. */
  var TABS = [
    { key: "ask", list: "questions", label: "Chat with a Team Member", listLabel: "My questions" },
    { key: "build", list: "sheets", label: "Create my call sheet", listLabel: "My call sheets" },
  ];

  function renderTabs(activeName) {
    var n = store.counts();
    document.getElementById("tabbar").innerHTML = TABS.map(function (t) {
      var section =
        activeName === t.key ||
        activeName === t.list ||
        (t.list === "questions" && activeName === "thread") ||
        (t.list === "sheets" && activeName === "sheet");
      var onList = section && activeName !== t.key;
      var bub = "";
      if (t.list === "questions" && n.unread) {
        bub = '<span class="bub">' + n.unread + '<span class="sr-only"> new answers</span></span>';
      }
      return (
        '<div class="tabsplit' + (section ? " active" : "") + '">' +
        '<button class="tab-main" data-act="go" data-to="' + t.key + '">' +
        t.label + "</button>" +
        '<button class="tab-list' + (onList ? " on" : "") +
        '" data-act="go" data-to="' + t.list + '" aria-label="' + t.listLabel + '">' +
        "&#9776;" + bub + "</button>" +
        "</div>"
      );
    }).join("");
  }

  /* ----------------------------------------------------------- router */

  function parseHash() {
    var h = (global.location.hash || "").replace(/^#\/?/, "");
    var parts = h.split("/").filter(Boolean);
    return { name: parts[0] || "ask", id: parts[1] || null };
  }

  function go(to, id) {
    global.location.hash = "/" + to + (id ? "/" + id : "");
  }

  var firstRender = true;

  function route() {
    var r = parseHash();
    var html;

    switch (r.name) {
      case "questions":
        html = views.questions();
        break;
      case "thread":
        store.markRead(r.id);
        html = views.thread(r.id);
        break;
      case "build":
        html = views.build();
        break;
      case "sheets":
        html = views.sheets();
        break;
      case "sheet":
        html = views.sheet(r.id);
        break;
      default:
        r.name = "ask";
        html = views.ask();
    }

    face.innerHTML = html;
    renderTabs(r.name);

    if (firstRender) firstRender = false;
    else global.scrollTo(0, 0);

    if (r.name === "ask") wireAskForm();
    if (r.name === "thread") {
      wireCompose("reply-form", "reply-input", onReply);
      var fb = document.getElementById("fb-form");
      if (fb) {
        wireCompose("fb-form", "fb-note", function (text) {
          store.setFeedback(r.id, "no", text);
          global.LZ.ui.explain = null;
          route();
          toast("Thank you — the team will take another look.");
        });
      }
      store.clearNew(r.id);
    }
    if (r.name === "build") wireBuildForm();
  }

  /* ------------------------------------------------------------ toast */

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.hidden = true;
    }, 3200);
  }

  /* ------------------------------------------------------------- chat */

  /** Compose bars submit on the button and on Enter (Shift+Enter = newline). */
  function wireCompose(formId, inputId, onSend) {
    var form = document.getElementById(formId);
    if (!form) return;
    var input = document.getElementById(inputId);

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    /* grow with the text, like every chat input */
    input.addEventListener("input", function () {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var body = input.value.trim();
      if (!body) {
        input.focus();
        return;
      }
      onSend(body, form);
    });
  }

  function wireAskForm() {
    var form = document.getElementById("ask-form");
    if (!form) return;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var body = document.getElementById("ask-body").value.trim();
      var err = document.getElementById("ask-error");
      if (!body) {
        err.classList.add("show");
        document.getElementById("ask-body").focus();
        return;
      }
      err.classList.remove("show");

      var zip = document.getElementById("ask-zip").value.trim();
      var st = document.getElementById("ask-state").value.trim();
      var thread = store.addQuestion({
        body: body,
        topic: "",
        location: [zip, st].filter(Boolean).join(", "),
      });
      go("thread", thread.id);
      scheduleTeamReply(thread);
    });
  }

  function onReply(body, form) {
    var id = form.querySelector("button[data-id]").getAttribute("data-id");
    store.addReply(id, body);
    route();
  }

  /** Typing dots after a moment, then the team's answer — like a real chat. */
  function scheduleTeamReply(thread) {
    if (pendingAnswer) clearTimeout(pendingAnswer);
    if (typingTimer) clearTimeout(typingTimer);

    typingTimer = setTimeout(function () {
      var slot = document.getElementById("typing-slot");
      var here = parseHash();
      if (slot && here.name === "thread" && here.id === thread.id) {
        slot.innerHTML = views.typingBubble();
        slot.scrollIntoView({ block: "end", behavior: "smooth" });
      }
    }, 1400);

    pendingAnswer = setTimeout(function () {
      store.simulateAnswer(thread.id);
      var here = parseHash();
      if (here.name === "thread" && here.id === thread.id) {
        store.markRead(thread.id);
        route();
      } else {
        thread.unread = true;
        store.save();
        renderTabs(here.name);
        toast("The Lesko Help team replied to your question.");
      }
    }, 5200);
  }

  /* ------------------------------------------------ build a call sheet */

  /* A tiny ZIP lookup so the demo shows a real place name. */
  var ZIPS = {
    "14604": ["Rochester", "New York"],
    "91302": ["Calabasas", "California"],
    "73110": ["Midwest City", "Oklahoma"],
    "77044": ["Houston", "Texas"],
    "83702": ["Boise", "Idaho"],
  };

  function wireBuildForm() {
    var form = document.getElementById("build-form");
    if (!form) return;

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      var topicKey = document.getElementById("b-topic").value;
      var zip = document.getElementById("b-zip").value.trim();
      var city = document.getElementById("b-city").value.trim();
      var state = document.getElementById("b-state").value.trim();
      var problem = document.getElementById("b-problem").value.trim();
      var err = document.getElementById("build-error");

      var missing = [];
      if (!topicKey) missing.push("pick what you need help with");
      if (!zip && !city) missing.push("add your ZIP code or your city");
      if (!problem) missing.push("tell us what is going on");

      if (missing.length) {
        err.textContent = "Almost there — please " + missing.join(", and ") + ".";
        err.classList.add("show");
        return;
      }
      err.classList.remove("show");

      if (zip && !city && ZIPS[zip]) {
        city = ZIPS[zip][0];
        state = state || ZIPS[zip][1];
      }

      runGeneration({
        topicKey: topicKey,
        zip: zip,
        city: city,
        state: state,
        problem: problem,
      });
    });
  }

  function runGeneration(input) {
    face.innerHTML = views.generating();
    global.scrollTo(0, 0);

    var msgs = store.copy.callsheet.progress;
    var msgEl = document.getElementById("progress-msg");
    var barEl = document.getElementById("progress-bar");
    var i = 0;

    function tick() {
      if (i < msgs.length) {
        msgEl.textContent = msgs[i];
        barEl.style.width = Math.round(((i + 1) / msgs.length) * 100) + "%";
        i++;
        setTimeout(tick, 1000);
      } else {
        var sheet = store.buildSheet(input);
        go("sheet", sheet.id);
        toast("Saved under Call sheets — it is yours for good.");
      }
    }
    setTimeout(tick, 250);
  }

  /* ------------------------------------------- spreadsheet export
     Keeps the original 14 research columns, plus Called. */

  function exportCsv(sheetId) {
    var sh = store.getSheet(sheetId);
    if (!sh) return;

    var cols = [
      "Called", "Name of Organization", "Website", "Contact Email Address",
      "Contact Phone Number", "Contact Information", "Eligibility Requirements",
      "Area Requirements", "Dates of Eligibility",
      "Description of Services Available", "Dollar Value of Free Services",
      "Grants or Loans Available", "Max Amount of Grants or Loans",
      "Important Things to Consider Before Applying", "30 Second Call Script",
    ];

    function q(v) {
      return '"' + String(v === null || v === undefined ? "" : v).replace(/"/g, '""') + '"';
    }

    var lines = [cols.map(q).join(",")];
    sh.orgs.forEach(function (o) {
      lines.push(
        [
          store.isCalled(sh.id, o.id) ? "Yes" : "No",
          o.name, o.url, o.email || "", o.phone, o.address || "",
          o.whoQualifies, o.area, o.whenToApply, o.plainWhat,
          o.freeServices, o.moneyType, o.maxAmount, o.beforeYouCall, o.script,
        ].map(q).join(",")
      );
    });

    var name =
      "Lesko-Call-Sheet-" +
      sh.topic.replace(/[^a-z0-9]+/gi, "-") + "-" +
      (sh.zip || sh.city || "").replace(/[^a-z0-9]+/gi, "-") + ".csv";

    var blob = new Blob(["﻿" + lines.join("\r\n")], {
      type: "text/csv;charset=utf-8;",
    });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1500);
    toast("Downloading your call sheet as a spreadsheet.");
  }

  /* ------------------------------------------------ copy to clipboard */

  function copyText(text) {
    function done() {
      toast("Copied. Paste it anywhere.");
    }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        done();
      } catch (e) {
        toast("Select the words and copy them by hand.");
      }
      document.body.removeChild(ta);
    }
    if (global.navigator.clipboard && global.navigator.clipboard.writeText) {
      global.navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  /* ------------------------------------------ per-row notes on a sheet */

  function openNoteEditor(btn) {
    var sheetId = btn.getAttribute("data-sheet");
    var orgId = btn.getAttribute("data-org");
    var row = document.getElementById("wrow-" + sheetId + "-" + orgId);
    if (!row) return;
    var slot = row.querySelector('[data-slot="note"]');
    var current = store.orgNote(sheetId, orgId);

    slot.innerHTML =
      '<div class="w-note-edit">' +
      '<label class="sr-only" for="ne-input">Your note</label>' +
      '<input id="ne-input" type="text" value="' + views.esc(current) +
      '" placeholder="Who you spoke to, what they said…">' +
      '<button type="button" class="btn red" id="ne-save">Save</button>' +
      "</div>";
    btn.hidden = true;

    var input = slot.querySelector("#ne-input");
    var saveBtn = slot.querySelector("#ne-save");
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);

    function saveNote() {
      var text = input.value.trim();
      store.setOrgNote(sheetId, orgId, text);
      slot.innerHTML = text
        ? '<p class="w-note-text">&#128221; ' + views.esc(text) + "</p>"
        : "";
      btn.hidden = false;
      btn.textContent = text ? "Edit note" : "+ Note";
      if (text) toast("Note saved.");
    }

    saveBtn.addEventListener("click", saveNote);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        saveNote();
      }
    });
  }

  /* --------------------------------- two-tap reset (no browser dialogs) */

  function armReset(btn) {
    btn.dataset.label = btn.dataset.label || btn.textContent.trim();
    btn.setAttribute("data-armed", "yes");
    btn.textContent = "Tap again to start over";
    if (resetTimer) clearTimeout(resetTimer);
    resetTimer = setTimeout(function () {
      btn.removeAttribute("data-armed");
      btn.textContent = btn.dataset.label;
    }, 5000);
  }

  /* ------------------------------------------- delegated interaction */

  document.addEventListener("click", function (e) {
    if (!e.target || !e.target.closest) return;
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");

    switch (act) {
      case "go":
        go(t.getAttribute("data-to"));
        break;

      case "thread":
        go("thread", t.getAttribute("data-id"));
        break;

      case "sheet":
        go("sheet", t.getAttribute("data-id"));
        break;

      case "toggle-org": {
        var detail = document.getElementById(t.getAttribute("data-target") + "-d");
        var open = detail.hidden;
        detail.hidden = !open;
        t.setAttribute("aria-expanded", open ? "true" : "false");
        t.querySelector("span[aria-hidden]").innerHTML = open ? "&#9652;" : "&#9662;";
        break;
      }

      case "copy":
        copyText(t.getAttribute("data-text"));
        break;

      case "print":
        global.print();
        break;

      case "export-csv":
        exportCsv(t.getAttribute("data-sheet"));
        break;

      case "demo-file":
        toast("Demo — in the real zone this opens " + (t.getAttribute("data-name") || "the file") + ".");
        break;

      case "fb-yes":
        store.setFeedback(t.getAttribute("data-id"), "yes", "");
        route();
        toast("Thank you — good to know it helped.");
        break;

      case "fb-no":
        global.LZ.ui.explain = t.getAttribute("data-id");
        route();
        var fbBox = document.getElementById("fb-note");
        if (fbBox) fbBox.focus();
        break;

      case "org-note": {
        openNoteEditor(t);
        break;
      }

      case "reset": {
        if (t.getAttribute("data-armed") === "yes") {
          store.reset();
          go("ask");
          route();
          toast("The demo is back to how it started.");
          t.removeAttribute("data-armed");
          t.textContent = t.dataset.label;
          break;
        }
        armReset(t);
        break;
      }
    }
  });

  document.addEventListener("change", function (e) {
    if (!e.target || !e.target.closest) return;
    var t = e.target.closest("[data-act]");
    if (!t) return;

    if (t.getAttribute("data-act") === "called") {
      var sheetId = t.getAttribute("data-sheet");
      var orgId = t.getAttribute("data-org");
      var on = store.toggleCalled(sheetId, orgId);
      var row = t.closest(".wrow") || t.closest(".org");
      if (row) {
        row.classList.toggle("done", on);
        var slot = row.querySelector('[data-slot="called"]');
        if (slot) {
          slot.innerHTML = on
            ? "&#10003; Called " + views.esc(views.niceDate(store.calledOn(sheetId, orgId)))
            : "";
        }
      }
      if (on) toast("Ticked off. Well done — that is the hard part.");
    }
  });

  /* ------------------------------------------------------------ start */

  global.addEventListener("hashchange", route);

  store.init();
  if (!global.location.hash) global.location.hash = "/ask";
  route();

  /* A quiet way to reset the demo before showing it to someone. */
  global.LZ.resetDemo = function () {
    store.reset();
    route();
  };
})(window);

</script>
</body>
</html>
