<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Lesko Zone</title>
<meta name="description" content="Ask a question or build a call sheet — and keep every answer in one private place. A Lesko Help member tool.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>?</text></svg>">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="wrap">

  <!-- ---------------------------------------------------------- topbar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" title="Lesko Help">?</div>
      <div class="brand-name"><i>Lesko</i><b>Help</b></div>
    </div>
    <div class="suits" aria-hidden="true">
      <span>&spades;</span><span>&hearts;</span><span>&diams;</span><span>&clubs;</span>
    </div>
  </header>

  <!-- -------------------------------------------------------- masthead -->
  <section class="masthead">
    <div>
      <h1>Ask anything. <em>Keep every answer.</em></h1>
      <p class="hero-copy" id="mast-copy">Your questions and your call sheets, saved in one private place.</p>
    </div>
    <aside class="side-note" role="note">
      <span class="mono-label">&#128274; Private</span>
      <p>Only you and the Lesko Help team can see anything in here.</p>
    </aside>
  </section>

  <!-- ------------------------------------------------------------ tabs -->
  <nav class="tabbar" role="tablist" aria-label="Sections" id="tabbar"></nav>

  <!-- ------------------------------------------------------------ face -->
  <main id="face"></main>

  <!-- ---------------------------------------------------------- footer -->
  <footer class="foot">
    <div class="mono-label" id="foot-line">Lesko Help &middot; questions are free. always were.</div>
    <button class="reset-link" data-act="reset" type="button">Start the demo over</button>
    <div class="foot-suit" title="?">?</div>
  </footer>

</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/js/seed.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
